<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>Task Master</h1>
            <p>Focus on what matters.</p>
        </header>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?">
            <button id="add-btn"><i class="fas fa-plus"></i></button>
        </div>

        <div class="filters">
            <span class="active" onclick="filterTasks('all')">All</span>
            <span onclick="filterTasks('pending')">Pending</span>
            <span onclick="filterTasks('completed')">Completed</span>
        </div>

        <ul class="todo-list" id="todo-list">
            </ul>
        
        <div class="footer-info">
            <p>You have <span id="count">0</span> pending tasks</p>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
